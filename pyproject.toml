[project]
name = "ollama-image-to-prompt"
description = "A custom node for ComfyUI that leverages local Ollama vision models to generate detailed prompts or Danbooru-style tags from images."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["requests", "numpy", "Pillow"]

[project.urls]
Repository = "https://github.com/jluo-github/comfyui-ollama-image-to-prompt"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/jluo-github/comfyui-ollama-image-to-prompt/wiki"
"Bug Tracker" = "https://github.com/jluo-github/comfyui-ollama-image-to-prompt/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "comfyui-ollama-image-to-prompt"
Icon = ""
includes = [] 
